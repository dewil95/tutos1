name: CI

on:
  push:
    branches: ["main", "ccr-*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://mca:mca@localhost:5432/mca?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mca/db validate
      - run: pnpm --filter @mca/db generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

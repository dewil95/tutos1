name: CI

on:
  push:
    branches: ["main", "ccr-*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mca/db validate
      - run: pnpm --filter @mca/db generate
      - run: pnpm typecheck
      # Database tests run on a temporary SQLite file with packages/db/migrations applied.
      - run: pnpm test
      - run: pnpm format:check
      # The standalone server the Oracle machine runs (apps/web/.next/standalone).
      - run: pnpm --filter @mca/web build
      - name: Database migrations apply to a fresh file
        run: DATABASE_PATH="$RUNNER_TEMP/crm.db" pnpm db:migrate
      - name: Server scripts parse
        run: |
          bash -n deploy/oracle/setup-server.sh
          bash -n deploy/oracle/update.sh
          bash -n deploy/oracle/public-https.sh

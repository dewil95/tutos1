name: CI

on:
  push:
    branches: ["main", "ccr-*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mca/db validate
      - run: pnpm --filter @mca/db generate
      - run: pnpm typecheck
      # Database tests run on a local Cloudflare D1 (Miniflare) with packages/db/migrations applied.
      - run: pnpm test
      - run: pnpm format:check
      # The Cloudflare Worker build, and its size: Workers Paid allows 10 MiB compressed.
      - run: pnpm --filter @mca/web cf:build
      - name: Worker bundle size
        working-directory: apps/web
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker" | tee "$RUNNER_TEMP/size.txt"
          kib=$(grep -oE 'gzip: [0-9.]+' "$RUNNER_TEMP/size.txt" | grep -oE '[0-9.]+')
          echo "compressed: ${kib} KiB"
          awk -v k="$kib" 'BEGIN { exit (k > 9500) }'

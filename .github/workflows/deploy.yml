name: Deploy to Oracle

# After each merge to main, updates the CRM on the Oracle server over SSH (it pulls main,
# builds, migrates the database and restarts). Needs three repository secrets:
#   ORACLE_HOST     the server's public IP address
#   ORACLE_USER     the SSH user (ubuntu on Oracle's Ubuntu images)
#   ORACLE_SSH_KEY  the private key of an SSH key pair whose public key is on the server
# Without them it skips, so nothing breaks before the server exists.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Server secrets present?
        id: ready
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_USER" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "Add ORACLE_HOST, ORACLE_USER and ORACLE_SSH_KEY in GitHub → Settings → Secrets → Actions to deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update the server
        if: steps.ready.outputs.go == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 20 "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" \
            'sudo BRANCH=main bash /opt/ascend-crm/deploy/oracle/update.sh'

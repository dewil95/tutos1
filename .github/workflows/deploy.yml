name: Deploy to Cloudflare

# Deploys main to Cloudflare Workers (crm.ascendfund.co) with its D1 database.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers + D1 edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets present?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub → Settings → Secrets → Actions to deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.ready.outputs.go == 'true'
        run: pnpm install --frozen-lockfile
      - name: Find (or create) the D1 database and put its id in wrangler.jsonc
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/web
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="ascend-crm");process.stdout.write(db?db.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create ascend-crm
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).find(d=>d.name==="ascend-crm").uuid))')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          echo "D1 database: $id"
      - name: Apply database migrations
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/web
        run: npx wrangler d1 migrations apply ascend-crm --remote
      - name: Build and deploy
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/web
        run: pnpm cf:build && npx opennextjs-cloudflare deploy
